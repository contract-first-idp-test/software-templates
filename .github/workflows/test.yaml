name: Deterministic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Print test tool versions
        run: |
          node --version
          npm --version
      - name: Run deterministic tests
        run: make test
      - run: git diff --check
