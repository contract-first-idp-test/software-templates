name: Deterministic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: software-templates
      - uses: actions/checkout@v4
        with:
          repository: contract-first-idp-test/platform-components
          path: platform-components
      - uses: actions/checkout@v4
        with:
          repository: contract-first-idp-test/developer-charts
          ref: v1.0.0
          path: developer-charts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: software-templates/package-lock.json
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: npm ci
        working-directory: software-templates
      - run: npm test
        working-directory: software-templates
      - run: npm run test:remote-revision
        working-directory: software-templates
      - run: npm run test:smoke
        working-directory: software-templates
        env:
          BACKSTAGE_URL: ${{ vars.SMOKE_BACKSTAGE_URL }}
          BACKSTAGE_TOKEN: ${{ secrets.SMOKE_BACKSTAGE_TOKEN }}
          TEST_DOMAIN_REF: ${{ vars.SMOKE_TEST_DOMAIN_REF }}
          TEST_SYSTEM_REF: ${{ vars.SMOKE_TEST_SYSTEM_REF }}
          TEST_COMPONENT_REF: ${{ vars.SMOKE_TEST_COMPONENT_REF }}
      - run: git diff --check
        working-directory: software-templates
