apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: system-golden-path
  title: System Golden Path
  description: Create a System and activate only its Domain's designated build environment.
  annotations: {backstage-gitea.io/github-compatible: 'true'}
  tags: [contract-first, gitops, system]
spec:
  owner: group:default/platform-maintainers
  type: system
  parameters:
    - title: System
      required: [systemName, description, domainRef]
      properties:
        systemName:
          title: System name
          type: string
          pattern: '^([a-z][a-z0-9]*)(-[a-z0-9]+)*$'
        description: {title: Description, type: string}
        domainRef:
          title: Domain
          type: string
          ui:field: EntityPicker
          ui:options: {allowArbitraryValues: false, catalogFilter: [{kind: Domain}]}
  steps:
    - id: fetchDomain
      name: Fetch Domain policy
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.domainRef }}
        defaultKind: Domain
        defaultNamespace: default
    - id: fetchTarget
      name: Fetch platform target
      action: catalog:fetch
      input:
        entityRef: ${{ steps.fetchDomain.output.entity.spec.platformTarget }}
        defaultKind: Resource
        defaultNamespace: default
    - id: validateCompatibility
      name: Validate platform compatibility
      action: roadiehq:utils:jsonata
      input:
        data:
          platformVersion: ${{ steps.fetchTarget.output.entity.spec.platform.distribution.version }}
          developerChartsVersion: ${{ steps.fetchTarget.output.entity.spec.platform.dependencies.developerCharts.version }}
        expression: |
          (
            $parts := function($v) { $map($split($v, "."), function($n) { $number($n) }) };
            $gte := function($a, $b) { $a[0] > $b[0] or ($a[0] = $b[0] and ($a[1] > $b[1] or ($a[1] = $b[1] and $a[2] >= $b[2]))) };
            $lt := function($a, $b) { $a[0] < $b[0] or ($a[0] = $b[0] and ($a[1] < $b[1] or ($a[1] = $b[1] and $a[2] < $b[2]))) };
            $platform := $parts(platformVersion);
            $charts := $parts(developerChartsVersion);
            $not($gte($platform, [1, 1, 0]) and $lt($platform, [2, 0, 0]))
              ? $error("This software-templates 1.1.1 release requires platform-components >=1.1.0 <2.0.0. The selected Platform Target provides platform-components " & platformVersion & ". Upgrade the Platform Target or use a compatible software-templates release.")
              : $not($gte($charts, [1, 0, 0]) and $lt($charts, [1, 1, 0]))
              ? $error("This software-templates 1.1.1 release requires developer-charts >=1.0.0 <1.1.0. The selected Platform Target provides developer-charts " & developerChartsVersion & ". Upgrade the Platform Target or use a compatible software-templates release.")
              : {"compatible": true}
          )
    - id: renderBase
      name: Render System repository
      action: fetch:template
      input:
        url: ../../skeletons/system/base
        targetPath: system-repo
        values:
          systemName: ${{ parameters.systemName }}
          description: ${{ parameters.description }}
          owner: group:default/domain-maintainers
          domainRef: ${{ parameters.domainRef }}
          groupId: ${{ steps.fetchDomain.output.entity.spec.groupId }}.${{ parameters.systemName | replace('-', '') }}
          scmProvider: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-provider'] or 'github' }}
          scmHost: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}
          domainOrg: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}
          domainRepo: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-repo'] }}
          repositoryName: ${{ parameters.systemName }}-system
    - id: renderDomainActivation
      name: Render build-environment activation
      action: fetch:template
      input:
        url: ../../skeletons/system/domain-repo
        targetPath: domain-pr/systems/${{ parameters.systemName }}/environments
        values:
          environment: ${{ steps.fetchDomain.output.entity.spec.environments.build }}
          systemName: ${{ parameters.systemName }}
          groupId: ${{ steps.fetchDomain.output.entity.spec.groupId }}.${{ parameters.systemName | replace('-', '') }}
          systemRepoCloneUrl: https://${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}/${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}/${{ parameters.systemName }}-system.git
          systemRepoRevision: main
    - id: publish
      name: Publish System repository
      action: publish:github
      input:
        sourcePath: system-repo
        repoUrl: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}?owner=${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}&repo=${{ parameters.systemName }}-system
        description: GitOps repository for System ${{ parameters.systemName }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: true
        requiredApprovingReviewCount: 0
        protectEnforceAdmins: true
        collaborators:
          - {team: domain-maintainers, access: maintain}
          - {team: domain-contributors, access: push}
          - {team: domain-viewers, access: pull}
    - id: applicationWebhook
      name: Notify Argo CD on System changes
      action: github:webhook
      input:
        repoUrl: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}?owner=${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}&repo=${{ parameters.systemName }}-system
        webhookUrl: ${{ steps.fetchTarget.output.entity.spec.platform.argocd.webhooks.application }}
        events: [push]
        active: true
        contentType: json
        insecureSsl: false
    - id: applicationSetWebhook
      name: Notify ApplicationSet on System changes
      action: github:webhook
      input:
        repoUrl: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}?owner=${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}&repo=${{ parameters.systemName }}-system
        webhookUrl: ${{ steps.fetchTarget.output.entity.spec.platform.argocd.webhooks.applicationSet }}
        events: [push]
        active: true
        contentType: json
        insecureSsl: false
    - id: register
      name: Register System immediately
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
    - id: domainPr
      name: Open build-environment activation pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/scm-host'] }}?owner=${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-org'] }}&repo=${{ steps.fetchDomain.output.entity.metadata.annotations['contract-first-idp.github.io/domain-repo'] }}
        branchName: add-system-${{ parameters.systemName }}-to-${{ steps.fetchDomain.output.entity.spec.environments.build }}
        title: Create System ${{ parameters.systemName }} in ${{ steps.fetchDomain.output.entity.spec.environments.build }}
        description: Merging this pull request creates System ${{ parameters.systemName }}'s platform presence in the Domain's build environment.
        sourcePath: domain-pr
        createWhenEmpty: false
  output:
    links:
      - title: System repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Domain build-environment pull request
        url: ${{ steps.domainPr.output.remoteUrl }}
      - title: System catalog entity
        icon: catalog
        entityRef: system:default/${{ parameters.systemName }}
